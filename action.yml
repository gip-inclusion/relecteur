name: relecteur
description: >-
  Reviews a pull request with open-code-review, by the repository's REVIEW.md, AGENTS.md and
  .relecteur/config.toml, and posts the findings on the lines they concern, with a summary in
  French. It comments only: it neither approves a pull request nor requests changes.

inputs:
  api_key:
    description: API key of the reviewer's model endpoint, as RELECTEUR_API_KEY for `relecteur eval`.
    required: true
  github_token:
    description: Token that reads the pull request and posts the review.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Read the pull request
      id: pr
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const comment = context.payload.comment;
          if (comment) {
            // A comment calls the reviewer when a line of its own, not one it quotes, names it, and
            // when its author may push to the repository.
            const own = comment.body.split('\n').filter((line) => !line.trimStart().startsWith('>'));
            if (!own.join('\n').includes('@relecteur')) {
              core.notice('The comment only quotes @relecteur: no review.');
              return core.setOutput('review', 'false');
            }
            const permission = await github.rest.repos
              .getCollaboratorPermissionLevel({ ...context.repo, username: comment.user.login })
              .then(({ data }) => data.permission, () => 'none');
            if (!['admin', 'write'].includes(permission)) {
              core.notice(`${comment.user.login} cannot push to the repository: no review.`);
              return core.setOutput('review', 'false');
            }
          }
          const { data: pr } = await github.rest.pulls.get({
            ...context.repo,
            pull_number: context.payload.pull_request?.number ?? context.payload.issue.number,
          });
          core.setOutput('review', 'true');
          core.setOutput('number', pr.number);
          core.setOutput('base_ref', pr.base.ref);
          core.setOutput('head_sha', pr.head.sha);
          // The intent of the change, as `relecteur eval` gives it from a case: title, then description.
          core.setOutput('background', [pr.title, pr.body].map((text) => (text || '').trim()).filter(Boolean).join('\n\n'));

    # open-code-review updates in place the comment that carries its summary marker: this one,
    # until its own summary replaces it.
    - name: Tell that the review is under way
      if: steps.pr.outputs.review == 'true'
      uses: actions/github-script@v9
      env:
        PR_NUMBER: ${{ steps.pr.outputs.number }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const marker = '<!-- ocr-summary -->';
          const body = `${marker}\n⏳ **relecteur** relit cette PR : ses remarques arriveront en commentaire sur les lignes concernées, sans bloquer le merge.`;
          const issue_number = Number(process.env.PR_NUMBER);
          const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
          const summary = comments.reverse().find((comment) => (comment.body || '').includes(marker));
          if (summary) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: summary.id, body });
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number, body });
          }

    # The instructions and settings of the base branch, whatever the event.
    - name: Check out the base branch
      if: steps.pr.outputs.review == 'true'
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.pr.outputs.base_ref }}

    - name: Install relecteur
      if: steps.pr.outputs.review == 'true'
      shell: bash
      run: pipx install "$GITHUB_ACTION_PATH"

    - name: Read the review settings
      id: settings
      if: steps.pr.outputs.review == 'true'
      shell: bash
      run: |
        relecteur settings >> "$GITHUB_OUTPUT"
        relecteur rule > "$RUNNER_TEMP/relecteur-rule.json"

    # The engine reaches an OpenAI-compatible endpoint through the relay of `relecteur eval`, which
    # waits for Albert's rate limit, and asks its gateway up to 0.8.0 for tool calls.
    - name: Start the relay to the model
      id: model
      if: steps.pr.outputs.review == 'true'
      shell: bash
      env:
        MODEL_URL: ${{ steps.settings.outputs.model_url }}
        PROTOCOL: ${{ steps.settings.outputs.protocol }}
      run: |
        if [ "$PROTOCOL" != openai ]; then
          echo "url=$MODEL_URL" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        nohup relecteur proxy --port 8765 --model-url "$MODEL_URL" > "$RUNNER_TEMP/relecteur-proxy.log" 2>&1 &
        for _ in $(seq 30); do
          if curl --silent --output /dev/null http://127.0.0.1:8765; then
            echo "url=http://127.0.0.1:8765" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 1
        done
        echo "::error::The relay to $MODEL_URL did not start: $(cat "$RUNNER_TEMP/relecteur-proxy.log")"
        exit 1

    # The summary below tells how the review ended, and fails the job when the reviewer is at
    # fault: an engine run that fails does not fail the job by itself.
    - name: Review
      if: steps.pr.outputs.review == 'true'
      continue-on-error: true
      uses: alibaba/open-code-review@v1.12.13
      with:
        ocr_version: 1.12.13
        llm_url: ${{ steps.model.outputs.url }}
        llm_auth_token: ${{ inputs.api_key }}
        llm_model: ${{ steps.settings.outputs.model }}
        llm_protocol: ${{ steps.settings.outputs.protocol }}
        llm_use_anthropic: ${{ steps.settings.outputs.protocol == 'anthropic' }}
        # Anthropic's API takes an API key in x-api-key, where the engine sends a bearer token.
        llm_auth_header: ${{ steps.settings.outputs.protocol == 'anthropic' && 'x-api-key' || '' }}
        # The action disables thinking by default, which `relecteur eval` does not.
        llm_extra_body: '{}'
        language: ${{ steps.settings.outputs.language }}
        effort: ${{ steps.settings.outputs.effort }}
        review_concurrency: ${{ steps.settings.outputs.concurrency }}
        max_tokens_budget: ${{ steps.settings.outputs.max_tokens_budget }}
        rule: ${{ runner.temp }}/relecteur-rule.json
        background: ${{ steps.pr.outputs.background }}
        pr_number: ${{ steps.pr.outputs.number }}
        base_ref: ${{ steps.pr.outputs.base_ref }}
        head_sha: ${{ steps.pr.outputs.head_sha }}
        github_token: ${{ inputs.github_token }}
        # A review called again does not repeat a finding already posted on the same lines.
        incremental: 'true'

    - name: Summarize the review
      id: summary
      if: always() && steps.pr.outputs.review == 'true'
      shell: bash
      run: |
        set +e
        relecteur summary /tmp/ocr-result.json --stderr /tmp/ocr-stderr.log > "$RUNNER_TEMP/relecteur-summary.md"
        status=$?
        echo "failed=$([ "$status" -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/relecteur-summary.md"

    # The summary replaces the headline of open-code-review's, in English and the same whether
    # the review was complete or not, and keeps what follows: the findings it could not post on
    # their lines, and the engine's error.
    - name: Post the summary
      if: always() && steps.pr.outputs.review == 'true'
      uses: actions/github-script@v9
      env:
        PR_NUMBER: ${{ steps.pr.outputs.number }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const marker = '<!-- ocr-summary -->';
          const fs = require('fs');
          const path = `${process.env.RUNNER_TEMP}/relecteur-summary.md`;
          const headline = (fs.existsSync(path) && fs.readFileSync(path, 'utf8').trim()) ||
            "❌ **relecteur** n'a pas pu résumer sa review : le job de review échoue pour que le problème soit corrigé.";
          const issue_number = Number(process.env.PR_NUMBER);
          const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
          const summary = comments.reverse().find((comment) => (comment.body || '').includes(marker));
          if (!summary) {
            return await github.rest.issues.createComment({ ...context.repo, issue_number, body: `${marker}\n${headline}` });
          }
          const lines = summary.body.split('\n');
          const start = lines.findIndex((line) => line.includes(marker));
          const index = lines.findIndex((line, i) => i > start && line.trim() && !line.startsWith('<!--'));
          if (index === -1) lines.push(headline);
          else lines[index] = headline;
          await github.rest.issues.updateComment({ ...context.repo, comment_id: summary.id, body: lines.join('\n') });

    - name: Fail when the reviewer kept the review from the pull request
      if: always() && steps.summary.outputs.failed == 'true'
      shell: bash
      run: |
        echo "::error::$(cat "$RUNNER_TEMP/relecteur-summary.md" 2>/dev/null)"
        exit 1
