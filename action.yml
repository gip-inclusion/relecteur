name: relecteur
description: >-
  Reviews a pull request with open-code-review, as `relecteur eval` reviews a case: by the
  repository's REVIEW.md, AGENTS.md and .relecteur/config.toml. Posts the findings on the lines
  they concern, with a summary in French. It comments only: it neither approves a pull request
  nor requests changes.

inputs:
  api_key:
    description: API key of the reviewer's model endpoint, as RELECTEUR_API_KEY for `relecteur eval`.
    required: true
  github_token:
    description: Token that reads the pull request and posts the review.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Read the pull request
      id: pr
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const comment = context.payload.comment;
          if (comment) {
            // A comment calls the reviewer when a line of its own, not one it quotes, names it, and
            // when its author may push to the repository.
            const own = comment.body.split('\n').filter((line) => !line.trimStart().startsWith('>'));
            if (!own.join('\n').includes('@relecteur')) {
              core.notice('The comment only quotes @relecteur: no review.');
              return core.setOutput('review', 'false');
            }
            const permission = await github.rest.repos
              .getCollaboratorPermissionLevel({ ...context.repo, username: comment.user.login })
              .then(({ data }) => data.permission, () => 'none');
            if (!['admin', 'write'].includes(permission)) {
              core.notice(`${comment.user.login} cannot push to the repository: no review.`);
              return core.setOutput('review', 'false');
            }
          }
          const { data: pr } = await github.rest.pulls.get({
            ...context.repo,
            pull_number: context.payload.pull_request?.number ?? context.payload.issue.number,
          });
          core.setOutput('review', 'true');
          core.setOutput('number', pr.number);
          core.setOutput('base_ref', pr.base.ref);
          core.setOutput('head_sha', pr.head.sha);
          // The intent of the change, as `relecteur eval` gives it from a case: title, then description.
          core.setOutput('background', [pr.title, pr.body].map((text) => (text || '').trim()).filter(Boolean).join('\n\n'));

    # `relecteur post-review` updates in place the comment that carries this marker.
    - name: Tell that the review is under way
      if: steps.pr.outputs.review == 'true'
      uses: actions/github-script@v9
      env:
        PR_NUMBER: ${{ steps.pr.outputs.number }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const marker = '<!-- relecteur -->';
          const body = `${marker}\n⏳ **relecteur** relit cette PR : ses remarques arriveront en commentaire sur les lignes concernées.`;
          const issue_number = Number(process.env.PR_NUMBER);
          const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
          const summary = comments.reverse().find((comment) => (comment.body || '').includes(marker));
          if (summary) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: summary.id, body });
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number, body });
          }

    # Installs relecteur before the checkout of the base branch below. In a repository that reviews
    # itself with `uses: ./`, as relecteur does, the action's folder is the workspace: that checkout
    # replaces its code with the base branch's, and relecteur installed afterwards would be the base
    # branch's instead of the pull request's, without anything telling it.
    - name: Install relecteur and open-code-review
      if: steps.pr.outputs.review == 'true'
      shell: bash
      run: |
        pipx install "$GITHUB_ACTION_PATH"
        npm install --global @alibaba-group/open-code-review@1.12.13

    # The instructions and settings of the base branch, whatever the event, with the history that
    # gives the merge base. The token stays out of the repository's git configuration, where the
    # engine would find it.
    - name: Check out the base branch
      if: steps.pr.outputs.review == 'true'
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.pr.outputs.base_ref }}
        fetch-depth: 0
        persist-credentials: false

    # The engine runs in a step without the token that posts the review.
    - name: Review
      if: steps.pr.outputs.review == 'true'
      shell: bash
      env:
        RELECTEUR_API_KEY: ${{ inputs.api_key }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        BACKGROUND: ${{ steps.pr.outputs.background }}
      run: |
        git fetch --quiet --no-tags origin "pull/$PR_NUMBER/head"
        relecteur review-pr --base "$(git merge-base HEAD "$HEAD_SHA")" --head "$HEAD_SHA" \
          --background "$BACKGROUND" --output "$RUNNER_TEMP/relecteur"

    # Fails the job when the reviewer, rather than the model, kept the review from the pull request.
    - name: Post the review
      if: always() && steps.pr.outputs.review == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
      run: relecteur post-review "$RUNNER_TEMP/relecteur" --pr "$PR_NUMBER" --head "$HEAD_SHA"
